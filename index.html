<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <script type="text/javascript" src="./quiet.js"></script>
    <script type="module" src="script.js"></script>
    <script async type="text/javascript" src="./quiet-emscripten.js"></script>
    <title>SoundTransfer</title>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div>
          <h1>SoundTransfer</h1>
          <p>Send text or small files over sound.</p>
        </div>
        <div id="status" class="status">Loading…</div>
      </header>

      <section class="card">
        <div class="row">
          <label for="profileSelect">Profile</label>
          <select id="profileSelect"></select>
          <label for="vizSelect">Visualization</label>
          <select id="vizSelect">
            <option value="waveform">Waveform</option>
            <option value="spectrogram">Spectrogram</option>
          </select>
          <button id="listen">Listen</button>
        </div>
        <p id="profileHint" class="hint"></p>
        <div id="vizWrapper" class="viz-wrapper">
          <canvas id="waveform" width="800" height="200" aria-hidden="true"></canvas>
        </div>
      </section>

      <section class="card">
        <h2>Send text</h2>
        <div class="row">
          <input id="msgtosend" type="text" placeholder="Type a message" />
          <button id="send">Send</button>
        </div>
        <div class="progress-container">
          <div class="progress">
            <div id="sendProgress" class="progress-bar"></div>
          </div>
          <div id="progressInfo" class="progress-info"></div>
        </div>
      </section>

      <section class="card">
        <h2>Send file</h2>
        <div class="row">
          <input id="fileInput" type="file" />
          <button id="sendFile">Send file</button>
        </div>
        <label class="toggle">
          <input id="pixelDraw" type="checkbox" />
          Show received images pixel-by-pixel
        </label>
        <div id="fileInfo" class="file-info"></div>
        <p class="hint">Images and video are scaled and compressed. Keep files tiny for reliability.</p>
      </section>

      <section class="card">
        <h2>Received</h2>
        <div id="receivedList" class="received"></div>
      </section>
    </div>
  </body>
</html>
