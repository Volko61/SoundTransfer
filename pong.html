<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pong.css" />

    <script type="text/javascript" src="./quiet.js"></script>
    <script type="module" src="pong.js"></script>
    <script async type="text/javascript" src="./quiet-emscripten.js"></script>
    <title>SoundTransfer - Pong</title>
  </head>
  <body>
    <div class="app pong-app">
      <header class="app-header">
        <div>
          <h1>🏓 Sound Pong</h1>
          <p>2-Player Pong synced over audio</p>
        </div>
        <div class="header-controls">
          <a href="index.html" class="back-link">← Back to Transfer</a>
          <div id="status" class="status">Loading…</div>
        </div>
      </header>

      <section class="card">
        <div class="row">
          <label for="profileSelect">Profile</label>
          <select id="profileSelect"></select>
          <label for="playerSelect">Play as</label>
          <select id="playerSelect">
            <option value="1">Player 1 (Left)</option>
            <option value="2">Player 2 (Right)</option>
          </select>
        </div>
        <p class="hint">Both players must use the same profile. Player 1 hosts, Player 2 joins.</p>
      </section>

      <section class="card game-section">
        <div class="game-controls">
          <button id="hostGame" class="btn-host">Host Game (P1)</button>
          <button id="joinGame" class="btn-join">Join Game (P2)</button>
          <button id="stopGame" class="btn-stop" disabled>Stop</button>
        </div>
        
        <div class="score-board">
          <div class="score p1-score">
            <span class="player-label">Player 1</span>
            <span id="score1" class="score-value">0</span>
          </div>
          <div class="score-divider">:</div>
          <div class="score p2-score">
            <span id="score2" class="score-value">0</span>
            <span class="player-label">Player 2</span>
          </div>
        </div>

        <div class="game-container">
          <canvas id="pongCanvas" width="800" height="500"></canvas>
          <div id="gameMessage" class="game-message">Press Host or Join to start</div>
        </div>

        <div class="controls-hint">
          <p><strong>Controls:</strong> Use <kbd>W</kbd>/<kbd>S</kbd> or <kbd>↑</kbd>/<kbd>↓</kbd> to move your paddle</p>
        </div>
      </section>

      <section class="card">
        <h2>Connection Log</h2>
        <div id="connectionLog" class="connection-log"></div>
      </section>
    </div>
  </body>
</html>
